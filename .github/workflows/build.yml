name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest        # Apple Silicon
            name: macos-arm64
          - os: macos-15-intel      # Intel
            name: macos-intel
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0
      - run: pip install -r requirements.txt
      - run: python build.py
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/ExcelToJSON.app ExcelToJSON-${{ matrix.name }}.zip
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf ExcelToJSON-linux.tar.gz -C dist ExcelToJSON
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Copy-Item dist/ExcelToJSON.exe ExcelToJSON-windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ExcelToJSON-${{ matrix.name }}
          path: |
            ExcelToJSON-macos-*.zip
            ExcelToJSON-linux.tar.gz
            ExcelToJSON-windows.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: ExcelToJSON-*
